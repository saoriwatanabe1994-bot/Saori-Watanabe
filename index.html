<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>受付</title>

<script src="shared.js?v=20260319-1"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
body { font-family: sans-serif; padding: 10px; }

.day-btn{
font-size:24px;
padding:14px 20px;
margin:6px 4px;
opacity:0.6;
}

.day-btn.today{
opacity:1;
background:#66adff;
color:#fff;
font-weight:bold;
}

.class-btn{
font-size:32px;
padding:60px 28px;
margin:18px 0;
width:100%;
text-align:left;
}

.remain-btn{
font-size:28px;
padding:26px 20px;
margin:16px 0;
width:100%;
background:#ffd966;
color:#000;
font-weight:bold;
border:none;
border-radius:10px;
}

#complete{
position:fixed;
inset:0;
background:rgba(0,0,0,0.65);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

#completeBox{
background:#fff;
padding:44px 20px;
border-radius:18px;
text-align:center;
width:98%;
max-width:560px;
box-sizing:border-box;
line-height:1.6;
}

#completeDetail{
font-size:28px;
font-weight:700;
}

#completeDetail b{
font-size:36px;
}

.complete-title{
font-size:48px;
font-weight:800;
display:block;
}
</style>
</head>

<body>

<h2 id="title"></h2>

<button id="remainBtn" class="remain-btn">
受講数照会
</button>

<div id="dayButtons"></div>
<div id="container"></div>

<div id="complete">
  <div id="completeBox">
    <div id="completeDetail"></div>
  </div>
</div>

<script>
(async () => {

  await initLiffSafe();

  let member = null;

  const params = new URLSearchParams(window.location.search);
  member = params.get("member");

  if(member){
    member = decodeURIComponent(member).split("?")[0].trim();
  }

  // LIFFでURLが消えた場合
  if(!member){
    const url = new URL(location.href);
    member = url.searchParams.get("member");

    if(member){
      member = decodeURIComponent(member).split("?")[0].trim();
    }
  }

  // それでも無ければcontextから取得
  if(!member && typeof liff !== "undefined"){
    try{
      if(liff.isInClient()){
        const ctx = liff.getContext();
        if(ctx && ctx.queryParams && ctx.queryParams.member){
          member = String(ctx.queryParams.member).split("?")[0].trim();
        }
      }
    }catch(e){
      console.log("LIFF context error", e);
    }
  }

  window.currentMember = member || "";

  const title = document.getElementById("title");
  const container = document.getElementById("container");
  const dayButtons = document.getElementById("dayButtons");

  let selectedDay = getTokyoWeekdayLabel();
  if(selectedDay === "日") selectedDay = "月";

  let submitting = false;

  /* =====================
     受講数照会
  ===================== */

  document.getElementById("remainBtn").onclick = async () => {

    const currentMember = (window.currentMember || "").trim();

    if(!currentMember){
      alert("会員QRを読み取ってください");
      return;
    }

    try{
      showLoading();
      const data = await fetchCount(currentMember);
      showCount(data);
    }catch(e){
      alert("照会エラー");
      console.log("remainBtn error", e);
    }
  };

  /* =====================
     受付処理
  ===================== */

  async function submit(className){

    if(submitting) return;
    submitting = true;

    const currentMember = (window.currentMember || "").trim();

    if(!currentMember){
      alert("会員QRを読み取ってください（memberが取得できません）");
      submitting = false;
      return;
    }

    const url =
      APP_CONFIG.FORM_RESPONSE +
      "?" + APP_CONFIG.ENTRY_MEMBER + "=" + encodeURIComponent(currentMember) +
      "&" + APP_CONFIG.ENTRY_CLASS + "=" + encodeURIComponent(className);

    try{
      await fetch(url, { method:"POST", mode:"no-cors" });
    }catch(e){
      console.log("submit fetch error", e);
    }

    const complete = document.getElementById("complete");
    const completeDetail = document.getElementById("completeDetail");

    completeDetail.innerHTML =
      "<span class='complete-title'>✅ 受付完了</span><br><br>" +
      "会員番号：<b>" + escapeHtml(currentMember) + "</b><br>" +
      "クラス：<b>" + escapeHtml(className) + "</b><br><br>" +
      "<span>次の会員を読み取ってください</span>";

    complete.style.display = "flex";

    setTimeout(() => {
      try{
        if(typeof liff !== "undefined" && liff.isInClient()){
          liff.closeWindow();
        }else{
          complete.style.display = "none";
          submitting = false;
        }
      }catch(e){
        complete.style.display = "none";
        submitting = false;
      }
    }, 1200);
  }

  /* =====================
     クラス描画
  ===================== */

  function renderAll(){

    renderDayButtons({
      dayButtonsEl: dayButtons,
      selectedDay,
      onSelect: (day) => {
        selectedDay = day;
        renderAll();
      }
    });

    renderClasses({
      day: selectedDay,
      titleEl: title,
      containerEl: container,
      onSubmit: submit
    });
  }

  renderAll();

})();
</script>
</body>
</html>
