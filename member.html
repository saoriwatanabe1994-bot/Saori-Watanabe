<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>会員証</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #fff;
      width: 90%;
      max-width: 400px;
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .name {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .member {
      font-size: 18px;
      margin-bottom: 20px;
      color: #666;
    }

    .qr {
      margin: 20px 0;
    }

    .note {
      font-size: 14px;
      color: #999;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="title">会員証</div>

  <div class="name" id="name">--- ---</div>
  <div class="member" id="member">No.----</div>

  <div class="qr">
    <img id="qrImg" src="" width="220" height="220">
  </div>

</div>

<script>
  // URLから会員番号取得
  const params = new URLSearchParams(location.search);
  const member = params.get("member") || "000000";

  // 名前（仮：後でスプシ連動可）
  const name = "会員";

  // 表示
  document.getElementById("member").textContent = "No." + member;
  document.getElementById("name").textContent = name;

  // QR生成
  const qrUrl =
    "https://chart.googleapis.com/chart?chs=300x300&cht=qr&chl=" +
    encodeURIComponent("member=" + member);

  document.getElementById("qrImg").src = qrUrl;
</script>

</body>
</html>
